[package]
name = "poker-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
rand = "=0.9.5"
rand_chacha = "=0.9.0"
rs_poker = { version = "=4.1.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ureq = { version = "=3.4.0", features = ["json"] }
rusqlite = { version = "=0.38.0", default-features = false }
bevy = { version = "=0.18.1", default-features = false, features = [
    "bevy_state",
    "bevy_winit",
    "ui_bevy_render",
    "default_font",
    "png",
    "mouse",
    "keyboard",
    "wayland",
    "x11",
] }
